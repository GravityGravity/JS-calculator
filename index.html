<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" src="styles.css">
    <script type="module" src="script.js" defer></script>
</head>
<body>
    
    <h1 id="title">Calculator</h1>
    <p id="desc">Web page for my calculator!</p>

    <div id="display">DISPLAY</div>
    
    <div id="digits">
        <div class="row">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">+</button>
        </div>
        <div class="row">
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">-</button>
        </div>
        <div class="row">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">*</button>
        </div>
        <div class="row">
            <button id="operation">=</button>
            <button>0</button>
            <button>&period;</button>
            <button class="operator">/</button>
        </div>
    </div>
</body>
</html>
